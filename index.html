<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 学習資料</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: #0f172a;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
    }

    /* Title */
    .slide-title {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      text-align: center;
      padding: 40px;
    }

    .slide-title .label {
      color: #3b82f6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .slide-title h1 {
      color: #f8fafc;
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .slide-title .sub {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 60px;
    }

    .slide-title .hint {
      color: #475569;
      font-size: 12px;
      animation: blink 2s ease-in-out infinite;
    }

    .slide-section {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
    }
    .slide-section .sec-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: #3b82f6; margin-bottom: 12px;
    }
    .slide-section h1 {
      font-size: 42px; font-weight: 800;
      color: #f1f5f9; margin-bottom: 12px; letter-spacing: -0.02em;
    }
    .slide-section .sec-desc {
      font-size: 14px; color: #64748b;
      max-width: 520px; line-height: 1.7; margin-bottom: 24px;
    }
    .sec-topics { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
    .sec-topic {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 5px 14px;
      font-size: 12px; color: #94a3b8;
    }
    .sec-adv-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #431407; border: 1px solid #f97316;
      color: #fb923c; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; padding: 4px 14px;
      border-radius: 20px; margin-bottom: 14px;
    }
    .slide-section.adv .sec-label { color: #f97316; }
    .slide-section.adv h1 { color: #fed7aa; }
    .slide-section.adv .sec-topic { border-color: #431407; color: #94a3b8; }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    /* Content slide */
    .slide-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .slide-header {
      background: #0f172a;
      padding: 10px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .section-badge {
      font-size: 11px;
      color: #fff;
      background: #3b82f6;
      padding: 3px 12px;
      border-radius: 12px;
      font-weight: 600;
    }

    .slide-counter {
      font-size: 11px;
      color: #64748b;
    }

    .slide-main {
      flex: 1;
      padding: 32px 56px 20px;
      overflow-y: auto;
      min-height: 0;
    }

    .slide-main h2 {
      font-size: 26px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .slide-main p {
      color: #334155;
      font-size: 14.5px;
      line-height: 1.85;
      margin-bottom: 10px;
    }

    .slide-main ul {
      list-style: none;
      margin: 6px 0 10px;
    }

    .slide-main li {
      color: #334155;
      font-size: 14.5px;
      line-height: 1.8;
      padding-left: 18px;
      position: relative;
      margin-bottom: 4px;
    }

    .slide-main li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: #3b82f6;
    }

    .term {
      font-weight: 700;
      color: #1d4ed8;
      background: #eff6ff;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .note {
      background: #fef9c3;
      border-left: 3px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 13px;
      color: #78350f;
      margin-top: 10px;
    }

    /* Cheat sheet */
    .cheatsheet {
      background: #f8fafc;
      border-top: 2px solid #e2e8f0;
      flex-shrink: 0;
    }

    .cs-label {
      background: #1e293b;
      color: #64748b;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 24px;
    }

    .cs-body {
      padding: 12px 24px 14px;
      overflow-y: auto;
      max-height: 190px;
    }

    .cs-body pre {
      background: #0f172a;
      color: #cbd5e1;
      padding: 12px 16px;
      border-radius: 7px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.75;
      overflow-x: auto;
    }

    .c {
      color: #475569;
    }

    /* Nav */
    .nav-prev,
    .nav-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.75);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }

    .nav-prev:hover,
    .nav-next:hover {
      background: rgba(59, 130, 246, 0.85);
      border-color: #3b82f6;
    }

    .nav-prev {
      left: 10px;
    }

    .nav-next {
      right: 10px;
    }

    .nav-prev:disabled,
    .nav-next:disabled {
      opacity: 0.15;
      cursor: not-allowed;
    }

    /* Progress */
    .progress {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #1e293b;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      transition: width 0.3s ease;
    }

    /* === Section 1 リッチレイアウト === */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 12px;
    }

    .two-col>div {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .two-col>div h4 {
      font-size: 13px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .two-col li {
      font-size: 13px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0 0;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .card .card-icon {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .card h4 {
      font-size: 12.5px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .card p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin: 0;
    }

    .flow-diagram {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 0 0 12px;
    }

    .flow-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 10px;
      text-align: center;
      flex: 1;
    }

    .fb-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .flow-box h4 {
      font-size: 11.5px;
      color: #e2e8f0;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .flow-box p {
      font-size: 10.5px;
      color: #94a3b8;
      margin: 0;
      line-height: 1.4;
    }

    .flow-arrow {
      color: #3b82f6;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      flex-shrink: 0;
    }

    .analogy {
      background: #ecfdf5;
      border-left: 3px solid #10b981;
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      margin: 0 0 12px;
    }

    .analogy .analogy-label {
      font-size: 11px;
      font-weight: 700;
      color: #059669;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .analogy p {
      font-size: 13.5px;
      color: #064e3b;
      margin: 0;
      line-height: 1.65;
    }

    .setup-steps {
      list-style: none;
      margin: 8px 0;
    }

    .setup-steps li {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .ss-num {
      background: #3b82f6;
      color: white;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .ss-content h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .ss-content p {
      font-size: 13px;
      color: #475569;
      margin: 0;
      line-height: 1.65;
    }

    /* 2カラム色分け */
    .col-git {
      background: #eff6ff !important;
      border-color: #bfdbfe !important;
    }

    .col-github {
      background: #f5f3ff !important;
      border-color: #ddd6fe !important;
    }

    /* カード色分け（SVGの色と対応） */
    .card {
      transition: box-shadow 0.15s;
    }

    .card:hover {
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .card-branch {
      border-color: #86efac !important;
    }

    .card-head {
      border-color: #fcd34d !important;
    }

    .card-merge {
      border-color: #93c5fd !important;
    }

    /* OS別インストール */
    .os-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 8px 0 6px;
    }

    .os-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
    }

    .os-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }

    .os-item code,
    .os-item span {
      font-size: 11px;
      color: #0f172a;
    }

    /* ボックス統一 */
    .warn-box {
      background: #fef2f2;
      border-left: 3px solid #ef4444;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin-top: 8px;
      font-size: 12.5px;
      color: #991b1b;
      line-height: 1.65;
    }

    .info-box {
      background: #f1f5f9;
      border-left: 3px solid #94a3b8;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin-top: 8px;
      font-size: 12.5px;
      color: #475569;
      line-height: 1.65;
    }

    .divider-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin: 12px 0 6px;
    }

    /* 開発サイクル カード */
    .step-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 10px 0;
    }

    .step-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 14px 12px;
    }

    .step-card-num {
      width: 26px;
      height: 26px;
      background: #3b82f6;
      color: white;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .step-card h4 {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 5px;
    }

    .step-card p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.55;
      margin: 0;
    }

    .sc-cmd {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      color: #2563eb;
      background: #eff6ff;
      padding: 2px 7px;
      border-radius: 3px;
      display: inline-block;
      margin-top: 6px;
    }

    /* Push / Pull 図解 */
    .push-pull {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 10px 0;
    }

    .pp-box {
      border-radius: 8px;
      padding: 14px 16px;
      text-align: center;
    }

    .pp-push {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .pp-pull {
      background: #f0fdf4;
      border: 1px solid #86efac;
    }

    .pp-box h4 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pp-push h4 {
      color: #1d4ed8;
    }

    .pp-pull h4 {
      color: #15803d;
    }

    .pp-arrow {
      font-size: 26px;
      margin: 6px 0;
    }

    .pp-box p {
      font-size: 12px;
      color: #475569;
      line-height: 1.6;
      margin: 0 0 6px;
    }

    .pp-cmd {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.75);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    /* PR フロー */
    .pr-flow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 10px 0 12px;
    }

    .pr-step {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }

    .ps-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .pr-step h4 {
      font-size: 11.5px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .pr-step p {
      font-size: 10px;
      color: #64748b;
      margin: 0;
      line-height: 1.4;
    }

    .pr-arrow {
      color: #3b82f6;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 開発サイクル ステップ説明 */
    .cycle-steps {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .cycle-step {
      flex: 1;
      border-radius: 8px;
      padding: 10px 10px 8px;
      border-top: 3px solid;
    }

    .cs-blue {
      background: #eff6ff;
      border-color: #60a5fa;
    }

    .cs-purple {
      background: #f5f3ff;
      border-color: #c084fc;
    }

    .cs-green {
      background: #f0fdf4;
      border-color: #4ade80;
    }

    .cycle-step .cs-badge {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .cs-blue .cs-badge {
      color: #1d4ed8;
    }

    .cs-purple .cs-badge {
      color: #7c3aed;
    }

    .cs-green .cs-badge {
      color: #15803d;
    }

    .cycle-step h5 {
      font-size: 12px;
      color: #1e293b;
      margin-bottom: 2px;
      font-weight: 700;
    }

    .cycle-step p {
      font-size: 10.5px;
      color: #475569;
      line-height: 1.5;
      margin: 0;
    }

    /* ハンズオン ステップカード */
    .hs-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 8px 0; }
    .hs-card { background: #f8fafc; border: 1px solid #e2e8f0; border-top: 3px solid; border-radius: 8px; padding: 10px 12px; }
    .hs-card.hs-blue   { border-top-color: #60a5fa; }
    .hs-card.hs-purple { border-top-color: #c084fc; }
    .hs-card.hs-green  { border-top-color: #4ade80; }
    .hs-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 5px; }
    .hs-blue  .hs-badge  { color: #1d4ed8; }
    .hs-purple .hs-badge { color: #7c3aed; }
    .hs-green  .hs-badge { color: #15803d; }
    .hs-card h5 { font-size: 12px; font-weight: 700; color: #0f172a; margin-bottom: 5px; }
    .hs-card p  { font-size: 11px; color: #475569; line-height: 1.6; margin: 0; }
    .hs-sub     { font-size: 10px !important; color: #94a3b8 !important; margin-top: 5px !important; }

    /* ===== Branch Visualization ===== */
    .bviz-wrap { display:flex; flex-direction:column; flex:1; min-height:0; background:#fff; }
    .bviz-title-bar { padding:8px 18px 2px; font-size:14px; font-weight:700; color:#0f172a; flex-shrink:0; letter-spacing:-0.01em; }
    .bviz-svg-area { flex:1; padding:2px 12px 0; min-height:0; overflow:hidden; }
    .bviz-legend { padding:3px 18px 0; display:flex; gap:14px; flex-wrap:wrap; flex-shrink:0; }
    .bviz-leg { font-size:10px; font-weight:600; display:flex; align-items:center; gap:3px; }
    .bviz-leg-main    { color:#2563eb; }
    .bviz-leg-feature { color:#a855f7; }
    .bviz-leg-merge   { color:#10b981; }
    .bviz-leg-rebase  { color:#f97316; }
    .bviz-leg-head    { color:#f59e0b; }
    .bviz-terminal { background:#0f172a; margin:5px 12px 0; border-radius:8px; flex-shrink:0; overflow:hidden; }
    .bviz-term-chrome { padding:5px 10px; display:flex; gap:5px; align-items:center; border-bottom:1px solid #1e293b; }
    .bviz-term-chrome span { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .bviz-term-chrome span:nth-child(1) { background:#ef4444; }
    .bviz-term-chrome span:nth-child(2) { background:#f59e0b; }
    .bviz-term-chrome span:nth-child(3) { background:#22c55e; }
    .bviz-term-body { padding:7px 14px; font-family:'SF Mono','Fira Code','Consolas',monospace; font-size:12.5px; color:#e2e8f0; display:flex; align-items:center; gap:5px; min-height:32px; }
    .bviz-cmd-prompt { color:#4ade80; font-weight:700; flex-shrink:0; }
    .bviz-cursor { color:#94a3b8; animation:bviz-blink 1s step-end infinite; margin-left:1px; }
    @keyframes bviz-blink { 50% { opacity:0; } }
    .bviz-desc-bar { padding:5px 18px 2px; font-size:11.5px; color:#64748b; flex-shrink:0; line-height:1.55; min-height:24px; }
    .bviz-note-bar { padding:1px 18px 2px; font-size:11px; color:#f97316; flex-shrink:0; }
    .bviz-controls { padding:7px 12px 6px; display:flex; align-items:center; gap:8px; flex-shrink:0; border-top:1px solid #f1f5f9; }
    .bviz-btn { padding:6px 16px; border:1.5px solid #e2e8f0; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; background:#fff; color:#334155; white-space:nowrap; transition:background 0.12s, border-color 0.12s; }
    .bviz-btn:hover:not(:disabled) { background:#f8fafc; border-color:#94a3b8; }
    .bviz-btn:disabled { opacity:0.3; cursor:default; }
    .bviz-btn.next { background:#0f172a; color:#fff; border-color:#0f172a; }
    .bviz-btn.next:hover:not(:disabled) { background:#1e293b; }
    .bviz-btn.rst { padding:6px 11px; font-size:15px; border-color:#fca5a5; color:#dc2626; }
    .bviz-btn.rst:hover:not(:disabled) { background:#fef2f2; }
    .bviz-dots { display:flex; gap:5px; align-items:center; flex:1; justify-content:center; }
    .bviz-dot { width:7px; height:7px; border-radius:50%; background:#e2e8f0; transition:all 0.25s ease; flex-shrink:0; cursor:pointer; }
    .bviz-dot:hover { background:#94a3b8; }
    .bviz-dot.done { background:#94a3b8; }
    .bviz-dot.active { background:#0891b2; width:22px; border-radius:4px; }

           <div class="warn-box" style="margin-top:10px;">⚠️ ファイル操作は<strong>Git コマンドを使うこと。</strong> OS の mv / rm を直接使うと Git が変更を正しく認識できない場合がある。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> リネーム → エクスプローラーでファイルを右クリック →「名前変更 (F2)」→ VSCode が自動で git mv を実行してステージ済みにする。削除 → 右クリック →「削除」→ ソース管理パネルに削除が反映される。</div>`,
        c: `git mv &lt;old&gt; &lt;new&gt;            <span class="c"># リネーム（ステージ済み状態になる）</span>
git status                      <span class="c"># "renamed: old → new" と表示される</span>
git commit -m "rename: old to new"
git rm &lt;file&gt;                  <span class="c"># ファイルを削除してステージ</span>
git rm --cached &lt;file&gt;         <span class="c"># リポジトリからのみ削除（ファイルは残る）</span>
git rm -r &lt;directory&gt;          <span class="c"># ディレクトリを再帰的に削除</span>` },

      {
        s: 'Section 3: ローカルリポジトリ操作', t: 'コミット履歴の確認 (git log)',
        b: `<div class="analogy">🕐 <strong>git log</strong> は Git のタイムライン。いつ・誰が・何をコミットしたかを確認できる。<code>--oneline --graph --all</code> の組み合わせが特に有用。</div>
           <div class="two-col" style="margin-top:10px;">
             <div class="col-git">
               <h4>📋 よく使うオプション</h4>
               <ul style="font-size:12.5px;line-height:2.2;margin-top:6px;">
                 <li><code>--oneline</code> — 1行で簡潔に表示</li>
                 <li><code>--graph</code> — ブランチの分岐をグラフ表示</li>
                 <li><code>--all</code> — 全ブランチを対象に</li>
                 <li><code>-n 5</code> — 直近 5 件だけ表示</li>
                 <li><code>--grep="keyword"</code> — メッセージで検索</li>
               </ul>
             </div>
             <div class="col-github">
               <h4>🔍 特定ファイル・コミットを調査</h4>
               <ul style="font-size:12.5px;line-height:2.2;margin-top:6px;">
                 <li><code>git log -- &lt;file&gt;</code> — ファイルの変更履歴</li>
                 <li><code>git show &lt;hash&gt;</code> — コミットの詳細を確認</li>
                 <li><code>git blame &lt;file&gt;</code> — 行ごとの最終編集者</li>
               </ul>
             </div>
           </div>
           <div class="info-box">VSCode: エクスプローラー下部の「<strong>タイムライン</strong>」でファイルの変更履歴を GUI で確認できる。拡張機能「<strong>GitLens</strong>」などのツールを使うとさらに詳細な履歴を確認できる。</div>`,
        c: `git log --oneline --graph --all  <span class="c"># 全ブランチをグラフ表示（最重要）</span>
git log -n 5                     <span class="c"># 直近5件</span>
git log -- &lt;file&gt;                <span class="c"># 特定ファイルの変更履歴</span>
git log --grep="keyword"         <span class="c"># メッセージで検索</span>
git show &lt;hash&gt;                  <span class="c"># コミットの詳細確認</span>
git blame &lt;file&gt;                 <span class="c"># 行ごとの最終編集者を確認</span>` },

      {
        s: 'Section 3: ローカルリポジトリ操作', t: '.gitignore の設定',
        b: `<div class="analogy">🙈 <strong>.gitignore</strong> は Git に「このファイルは追跡しないで」と伝える設定ファイル。プロジェクトルートに置き、<strong>最初のコミット前</strong>に作成するのが理想。</div>
           <div class="two-col" style="margin-top:10px;">
             <div class="col-git">
               <h4>📝 記述パターン</h4>
               <ul style="font-size:12.5px;line-height:2.2;margin-top:6px;">
                 <li><code>node_modules/</code> — フォルダ全体を除外</li>
                 <li><code>*.log</code> — 拡張子で一括除外</li>
                 <li><code>.env</code> — 特定ファイルを除外</li>
                 <li><code>dist/</code> — ビルド成果物を除外</li>
                 <li><code>.DS_Store</code> — macOS 自動生成ファイル</li>
               </ul>
             </div>
             <div class="col-github">
               <h4>🗂 よくある除外対象</h4>
               <ul style="font-size:12.5px;line-height:2.2;margin-top:6px;">
                 <li>依存パッケージ（<code>node_modules/</code>）</li>
                 <li>環境変数・秘密鍵（<code>.env</code>）</li>
                 <li>ビルド成果物（<code>dist/</code>, <code>build/</code>）</li>
                 <li>ログファイル（<code>*.log</code>）</li>
                 <li>OS・エディタの設定ファイル</li>
               </ul>
             </div>
           </div>
           <div class="warn-box">⚠️ すでに Git が<strong>追跡中のファイル</strong>は .gitignore に追加しても自動的には除外されない。<code>git rm --cached &lt;file&gt;</code> で追跡を解除してから追加すること。</div>
           <div class="info-box">🌐 <strong>gitignore.io</strong> — 言語・フレームワーク・OS を選ぶと .gitignore テンプレートを自動生成してくれる便利サービス。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> ソース管理パネルで無視したいファイルを右クリック →「.gitignore に追加」で自動的に .gitignore へ追記できる。無視されたファイルはエクスプローラーでグレーアウト表示される。</div>`,
        c: `<span class="c"># .gitignore の記述例</span>
node_modules/
.env
*.log
dist/
.DS_Store
__pycache__/

git check-ignore -v &lt;file&gt;  <span class="c"># 無視されているか確認</span>
git rm --cached &lt;file&gt;      <span class="c"># 追跡中のファイルを除外（.gitignore追加後に実行）</span>` },

      // Section 4
      { type:'section', s:'Section 4', t:'ブランチ・マージ',
        desc:'ブランチなしのチーム開発は衝突だらけになる。安全に並行作業し、マージでチームの変更を統合する方法を理解する。',
        topics:['ブランチの基本操作','マージの種類（FF vs 3-way）','マージコンフリクトの解決'] },
      { s:'Section 4: ブランチ・マージ', t:'ブランチの基本操作',
        b:`<div class="analogy">🌿 <strong>ブランチ</strong>は「mainに影響を与えない安全な作業コピー」。作成コストが低く、機能・修正ごとに気軽に作れる。Git 2.23以降は <code>git switch</code> を使うのが推奨。</div>
           <div class="two-col" style="margin-top:10px;">
             <div class="col-git">
               <h4>🔍 ブランチとは</h4>
               <ul style="font-size:12.5px;line-height:2.2;margin-top:6px;">
                 <li>コミット履歴を指す<strong>軽量なポインタ</strong></li>
                 <li>作成・削除のコストが非常に低い</li>
                 <li>mainから分岐して独立した作業ができる</li>
                 <li>マージ前にコードレビューを受けられる</li>
               </ul>
             </div>
             <div class="col-github">
               <h4>⚙️ よく使う操作</h4>
               <ul style="font-size:12.5px;line-height:2.2;margin-top:6px;">
                 <li><code>git switch -c &lt;name&gt;</code> — 作成して切り替え</li>
                 <li><code>git switch &lt;name&gt;</code> — 切り替え</li>
                 <li><code>git branch</code> — 一覧表示</li>
                 <li><code>git branch -d &lt;name&gt;</code> — 削除（マージ済みのみ）</li>
                 <li><code>git branch -m &lt;old&gt; &lt;new&gt;</code> — リネーム</li>
               </ul>
             </div>
           </div>
           <div class="warn-box">⚠️ <code>git checkout</code> は古いコマンド。Git 2.23以降はブランチ切り替えに <code>git switch</code>、ファイル復元に <code>git restore</code> を使うのが推奨。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> ステータスバー左下のブランチ名をクリック → 一覧から選択、または「＋ 新しいブランチの作成」で作成＆切り替えが一度にできる。</div>`,
        c:`git branch                   <span class="c"># ローカルブランチ一覧</span>
git branch &lt;name&gt;            <span class="c"># ブランチ作成</span>
git switch &lt;name&gt;            <span class="c"># ブランチ切り替え</span>
git switch -c &lt;name&gt;         <span class="c"># 作成して切り替え（最もよく使う）</span>
git branch -m &lt;old&gt; &lt;new&gt;   <span class="c"># リネーム</span>
git branch -d &lt;name&gt;        <span class="c"># 削除（マージ済みのみ）</span>
git branch -D &lt;name&gt;        <span class="c"># 強制削除</span>` },

           <div class="two-col">
             <div class="col-git">
               <h4>⚡ Fast-forward</h4>
               <p style="font-size:12.5px;line-height:1.7;">分岐後にmainに変更がない場合。HEADポインタを前進するだけで完了。マージコミットは作成されず、履歴が直線になる。</p>
               <p style="font-size:11.5px;line-height:1.6;color:#64748b;margin-top:6px;">👤 一人作業や、チームでも自分が最初にマージする場面で起きやすい。mainが動いていないため衝突の心配がない。</p>
             </div>
             <div class="col-github">
               <h4>🔀 3-way マージ</h4>
               <p style="font-size:12.5px;line-height:1.7;">mainとfeatureの両方に変更がある場合。共通の祖先を基準に統合し、マージコミット(M)が作成される。ブランチの痕跡が履歴に残る。</p>
               <p style="font-size:11.5px;line-height:1.6;color:#64748b;margin-top:6px;">👥 複数人開発で、自分が作業している間に誰かがmainを更新していた場合に発生。コンフリクトが起きる可能性がある。</p>
             </div>
           </div>
           <div class="info-box">💡 <code>--no-ff</code> でFF可能でも常にマージコミットを作成できる。<code>--squash</code> でfeatureの全コミットを1つにまとめてマージも可能。</div>

git merge --squash &lt;branch&gt;  <span class="c"># 全コミットを1つにまとめてマージ</span>
git merge --ff-only &lt;branch&gt; <span class="c"># FFのみ許可（不可ならエラー）</span>
git log --oneline --graph     <span class="c"># マージ結果を確認</span>` },

      { s:'Section 4: ブランチ・マージ', t:'マージコンフリクトの解決',
        b:`<div class="analogy">⚡ <strong>コンフリクト</strong>は「同じファイルの同じ箇所を2つのブランチで変更した場合」に発生する。Git が自動判断できないため、人間が手動でどちらを採用するか選択する。</div>
           <ol class="setup-steps" style="margin-top:10px;">
             <li>
               <div class="ss-num">1</div>
               <div class="ss-content">
                 <h4>マージを実行 → コンフリクト発生</h4>
                 <p><code>git merge &lt;branch&gt;</code> を実行。コンフリクトが検出されると「CONFLICT」と表示されてマージが中断される。</p>
               </div>
             </li>
             <li>
               <div class="ss-num">2</div>
               <div class="ss-content">
                 <h4>コンフリクト箇所を確認・編集</h4>
                 <p><code>git status</code> で「both modified」なファイルを確認。エディタで開くとコンフリクトマーカーが表示される。どちらの内容を採用するか選択して保存する。</p>
                 <div class="warn-box" style="margin-top:6px;font-size:11.5px;">
                   <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> — 現在のブランチの変更<br>
                   <code>=======</code> — 区切り線<br>
                   <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</code> — マージ元ブランチの変更
                 </div>
               </div>
             </li>
             <li>
               <div class="ss-num">3</div>
               <div class="ss-content">
                 <h4>ステージ → コミットで完了</h4>
                 <p>解消したファイルを <code>git add &lt;file&gt;</code> でステージし、<code>git commit</code> でマージコミットを作成して完了。</p>
               </div>
             </li>
           </ol>
           <div class="info-box">💡 解決が難しい場合は <code>git merge --abort</code> でマージ前の状態に即座に戻せる。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> コンフリクトファイルを開くと「現在の変更を採用」「受信した変更を採用」「両方を採用」ボタンが表示される。クリックするだけでマーカーが解消される。</div>`,
        c:`git merge &lt;branch&gt;    <span class="c"># コンフリクト発生</span>
git status             <span class="c"># "both modified" のファイルを確認</span>
<span class="c"># エディタでコンフリクトマーカーを解消してから：</span>
git add &lt;file&gt;         <span class="c"># 解消したファイルをステージ</span>
git commit             <span class="c"># マージコミットを作成して完了</span>
git merge --abort      <span class="c"># マージを中断して元に戻す</span>` },

           <div class="two-col">
             <div class="col-git">
               <h4>🔍 fetch（安全に確認してからマージ）</h4>
               <p style="font-size:12px;line-height:1.7;">リモートの変更情報だけ取得し、作業ディレクトリは変更しない。<code>origin/main</code> に格納されるので、差分を確認してから <code>git merge origin/main</code> で反映できる。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">👤 「pull したら上書きされた！」を防ぎたいときに使う。</p>
             </div>
             <div class="col-github">
               <h4>⬇️ pull（作業開始前の必須習慣）</h4>
               <p style="font-size:12px;line-height:1.7;">fetch + merge を一度に実行。作業開始前に必ず実行してリモートの最新を取り込む。コンフリクトが発生した場合はマージコンフリクトと同じ手順で解決する。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">👥 チーム開発では pull を怠ると大量コンフリクトの原因になる。</p>
             </div>
           </div>
           <div class="info-box">🖥 <strong>VSCode:</strong> ソース管理パネルの「…」→「プル」「プッシュ」「フェッチ」から操作可能。ステータスバーの ↓↑ アイコンをクリックしても同期できる。</div>`,
        c:`git remote -v                   <span class="c"># リモート一覧とURL確認</span>
git fetch origin                 <span class="c"># 情報のみ取得（作業Dirに影響なし）</span>
git log origin/main --oneline    <span class="c"># fetchした内容を確認</span>
git diff origin/main             <span class="c"># リモートとの差分確認</span>
git merge origin/main            <span class="c"># 確認後にローカルへ反映</span>
git pull origin main             <span class="c"># fetch + merge を一括実行</span>
git pull --rebase                <span class="c"># マージコミットを作らずに取り込む</span>` },

      { s:'Section 5: リモートリポジトリ', t:'プルリクエスト（PR）の作成',
        b:`<div class="analogy">📋 <strong>プルリクエスト（PR）</strong>は「このブランチをmainにマージしてください」という依頼書。レビューを受けてからマージするチーム開発の要。CI/CDと連携すると自動テストもPRで実行できる。</div>
           <ol class="setup-steps" style="margin-top:10px;">
             <li>
               <div class="ss-num">1</div>
               <div class="ss-content">
                 <h4>作業ブランチをリモートにpush</h4>
                 <p><code>git push -u origin feature/xxx</code> で初回push。以降は <code>git push</code> のみでOK。</p>
               </div>
             </li>
             <li>
               <div class="ss-num">2</div>
               <div class="ss-content">
                 <h4>GitHub上でPRを作成</h4>
                 <p>push後にGitHubを開くと「Compare & pull request」バナーが表示される。<strong>base: main ← compare: feature/xxx</strong> を確認してタイトル・説明を書いて送信。</p>
               </div>
             </li>
             <li>
               <div class="ss-num">3</div>
               <div class="ss-content">
                 <h4>レビュー → 承認 → マージ</h4>
                 <p>レビュアーがコードを確認。修正依頼があれば同ブランチに追加コミットしてpushすれば自動的にPRへ反映される。承認後に「Merge pull request」でマージ。</p>
               </div>
             </li>
           </ol>
           <div class="info-box">💡 PRタイトルは何をしたか一言で。本文には背景・変更理由・確認ポイントを書くとレビュアーに親切。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> 「GitHub Pull Requests」拡張機能をインストールするとVSCode内でPRの作成・レビュー・マージまで完結できる。</div>`,
        c:`<span class="c"># 1. 作業ブランチをpush（初回は -u で上流設定）</span>
git push -u origin feature/xxx
<span class="c"># 2. 以降のpush</span>
git push
<span class="c"># 3. GitHub上でPR作成（GUI操作）</span>
<span class="c">#    base: main ← compare: feature/xxx</span>
<span class="c"># 4. マージ後にローカルを最新化・ブランチ削除</span>
git switch main
git pull
git branch -d feature/xxx` },

                 <li>GitHubでupstreamをfork</li>

                 <li><code>git remote add upstream &lt;url&gt;</code> で登録</li>

           </svg>
           <div class="two-col">
             <div class="col-git">
               <h4>📏 rebase を選ぶとき</h4>
               <p style="font-size:12px;line-height:1.7;">PRをマージする前にmainの最新を取り込んで履歴を整理したいとき。<code>git switch feature</code> → <code>git rebase main</code> でfeatureブランチの根っこをmainの先端に移す。</p>
             </div>
             <div class="col-github">
               <h4>🔀 merge を選ぶとき</h4>
               <p style="font-size:12px;line-height:1.7;">「いつ誰がどのブランチをマージしたか」の記録を明示的に残したいとき。チームのルールに従う。GitHubのPRマージはデフォルトでmergeコミットを作る。</p>
             </div>
           </div>
           <div class="warn-box">⚠️ <strong>push済みのコミットをrebaseしてはいけない。</strong>他の開発者のリポジトリと履歴が食い違い、強制pushが必要になる。rebaseは<strong>ローカルのみのブランチ</strong>で使う。</div>`,
        c:`git switch feature
git rebase main              <span class="c"># mainの先端をベースに付け替え</span>
git switch main
git merge feature            <span class="c"># rebase後はFF mergeできる</span>
git rebase -i HEAD~3         <span class="c"># 直近3コミットを対話的に整理</span>
<span class="c"># interactive: pick / reword / squash / drop</span>` },

      { s:'Section 6: Rebase', t:'rebase時のコンフリクト解決',
        b:`<div class="analogy">⚡ rebaseはコミットを1つずつ再適用するため、コミット数分だけコンフリクトが起きる可能性がある。mergeと違い<strong>1コミットごとに解消→continueを繰り返す</strong>のがポイント。</div>
           <ol class="setup-steps" style="margin-top:10px;">
             <li>
               <div class="ss-num">1</div>
               <div class="ss-content">
                 <h4>rebase実行 → コンフリクト発生</h4>
                 <p><code>git rebase main</code> を実行すると、コンフリクトがある時点で処理が止まる。<code>git status</code> で "both modified" のファイルを確認する。</p>
               </div>
             </li>
             <li>
               <div class="ss-num">2</div>
               <div class="ss-content">
                 <h4>コンフリクトを解消 → ステージ</h4>
                 <p>エディタでコンフリクト箇所を編集して解消する。解消後は <code>git add &lt;file&gt;</code> でステージング。<strong><code>git commit</code> は不要</strong>（continueが代わりに行う）。</p>
               </div>
             </li>
             <li>
               <div class="ss-num">3</div>
               <div class="ss-content">
                 <h4>--continue で次のコミットへ進む</h4>
                 <p><code>git rebase --continue</code> で次のコミットの再適用に進む。コミットが複数ある場合はステップ2〜3を繰り返す。全コミットが完了するとrebase終了。</p>
               </div>
             </li>
           </ol>
           <div class="warn-box">⚠️ <code>git rebase --abort</code> でrebase開始前の状態に完全に戻せる。困ったら迷わず中断しよう。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> rebaseのコンフリクトもマージコンフリクトと同じUIで解消できる。「現在の変更を採用」「受信した変更を採用」ボタンが利用可能。</div>`,
        c:`git rebase main              <span class="c"># コンフリクトが起きると処理停止</span>
git status                   <span class="c"># "both modified" を確認</span>
<span class="c"># エディタでコンフリクト箇所を編集・解消</span>
git add &lt;file&gt;
git rebase --continue        <span class="c"># 次のコミットへ（commit不要）</span>
git rebase --skip            <span class="c"># このコミットをスキップ</span>
git rebase --abort           <span class="c"># rebaseを中断して元に戻す</span>` },

      { s:'Section 6: Rebase', t:'pull --rebase と interactive rebase',
        b:`<div class="analogy">🧹 rebaseには2つの実用的な使い方がある。チームの最新を取り込む <strong>pull --rebase</strong> と、コミット履歴を整理する <strong>rebase -i</strong>（interactive rebase）。</div>
           <div class="two-col">
             <div class="col-git">
               <h4>⬇️ pull --rebase</h4>
               <p style="font-size:12px;line-height:1.7;">通常の <code>git pull</code>（fetch + merge）の代わりに fetch + rebase で取り込む。マージコミットが作られないため、履歴が一直線に保たれる。チームで「pullはrebaseで」とルール化されていることも多い。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">👥 毎回 <code>--rebase</code> を付けるのが面倒なら設定で固定できる。</p>
             </div>
             <div class="col-github">
               <h4>✂️ interactive rebase（rebase -i）</h4>
               <p style="font-size:12px;line-height:1.7;">PRを送る前にコミット履歴を整理したいときに使う。エディタが開き、各コミットに対して操作を指定できる。</p>
               <ul style="font-size:11.5px;line-height:1.8;padding-left:14px;margin:4px 0 0;">
                 <li><code>pick</code>　— そのまま残す</li>
                 <li><code>reword</code> — メッセージだけ変更</li>
                 <li><code>squash</code> — 前のコミットと1つにまとめる</li>
                 <li><code>drop</code>　— 削除する</li>
               </ul>
             </div>
           </div>
           <div class="info-box">💡 squash でWIP（作業途中）コミットをまとめてからPRを出すと、レビュアーが変更内容を把握しやすくなる。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> GitLens拡張の「Commits」ビューからinteractive rebaseをGUI操作できる。コマンドに慣れてきたら試してみよう。</div>`,
        c:`git pull --rebase origin main           <span class="c"># fetch + rebase で取り込む</span>
git config pull.rebase true             <span class="c"># このリポジトリの設定</span>
git config --global pull.rebase true   <span class="c"># グローバル設定</span>
git rebase -i HEAD~3                   <span class="c"># 直近3コミットを整理</span>
git rebase -i HEAD~5                   <span class="c"># 直近5コミットを整理</span>
<span class="c"># エディタで pick / reword / squash / drop を指定</span>` },

      // Section 7
      { type:'section', s:'Section 7', t:'Stash', adv:true,
        desc:'「急に別の対応が必要になった」は日常茶飯事。作業途中の変更をstashに退避して、コミットせず安全にブランチを切り替えよう。',
        topics:['stash基本操作（push・pop・apply）','stash応用（オプション・複数管理）'] },
      { s:'Section 7: Stash', t:'stashの基本操作',
        b:`<div class="analogy">📦 <strong>stash</strong>は「作業机の引き出し」。コミット前の変更を一時退避して、別の緊急作業に対応できる。stashはスタック構造で複数保持できる。</div>

           </svg>
           <div class="two-col">
             <div class="col-git">
               <h4>🗑 pop（取り出して削除）</h4>
               <p style="font-size:12px;line-height:1.7;">退避した変更を取り出し、stashの一覧からも消える。「一時退避 → 戻す」という通常の使い方はこちら。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">💡 取り出した変更と今の編集内容が衝突した場合は、stashは消えずに残る。</p>
             </div>
             <div class="col-github">
               <h4>📌 apply（取り出して保持）</h4>
               <p style="font-size:12px;line-height:1.7;">退避した変更を取り出すが、stashの一覧にも残したままにできる。同じ変更を複数のブランチで試したいときに便利。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">💡 使い終わったら「削除」コマンドで一覧を整理しよう。</p>
             </div>
           </div>
           <div class="warn-box">⚠️ <code>git stash apply</code> 時に現在の変更と衝突するとコンフリクトが発生する。<code>git status</code> で "both modified" を確認し、マージコンフリクトと同じ手順で解消 → <code>git add</code> で完了。</div>
           <div class="info-box">🖥 <strong>VSCode:</strong> ソース管理パネルの「…」→「変更を隠す（Stash）」から操作可能。「隠した変更をポップする」でpopもできる。</div>`,
        c:`git stash                         <span class="c"># 追跡中ファイルの変更を退避</span>
git stash list                    <span class="c"># stash一覧を確認</span>
git stash pop                     <span class="c"># 最新を取り出して削除</span>
git stash apply stash@{1}        <span class="c"># 番号指定で取り出す（保持）</span>
git stash drop                    <span class="c"># 最新のstashを削除</span>
git stash clear                   <span class="c"># 全stashを削除</span>` },

      { s:'Section 7: Stash', t:'stashの応用（オプション・複数管理）',
        b:`<div class="analogy">🗂 デフォルトの stash は「Gitが追跡しているファイルの変更」のみ退避する。新規ファイルや設定ファイルも一緒に退避したいときはオプションを指定する。</div>
           <div class="two-col">
             <div class="col-git">
               <h4>📁 何を退避するか選べる</h4>
               <ul style="font-size:12px;line-height:2.1;padding-left:14px;margin:0;">
                 <li><strong>デフォルト</strong> — Gitが知っているファイルの変更だけ</li>
                 <li><strong>新規ファイルも含む</strong><br>　まだ一度も追加していない新しいファイルも退避<br>　<span style="font-size:10.5px;color:#64748b;">（例: 作りかけの新しいコンポーネント）</span></li>
                 <li><strong>全ファイルを含む</strong><br>　.gitignoreで無視されているファイルも含めて全て退避<br>　<span style="font-size:10.5px;color:#64748b;">（例: .envなどの設定ファイルも）</span></li>
               </ul>
             </div>
             <div class="col-github">
               <h4>🏷 メモを付けて複数管理</h4>
               <p style="font-size:12px;line-height:1.7;">stashを何度も積み重ねると、どれが何の変更か分からなくなる。退避するときに一言メモを付けておくと、後で見たときに内容が一目でわかる。</p>
               <ul style="font-size:11.5px;line-height:2;padding-left:14px;margin:6px 0 0;">
                 <li>💾 <em>ログイン機能の編集中ファイル</em></li>
                 <li>💾 <em>スタイル調整中のファイル一式</em></li>
               </ul>
               <p style="font-size:10.5px;color:#64748b;margin-top:4px;">→ 一覧から内容を確認して取り出せる</p>
             </div>
           </div>
           <div class="warn-box">⚠️ 「全ファイルを含む」オプションは、パスワードや認証情報が入った設定ファイルも退避対象になる。意図せず巻き込まないよう注意しよう。</div>
           <div class="info-box">💡 stashはあくまで一時退避用。長期間放置すると何の変更か分からなくなる。コミットできる状態になったら早めにコミットする習慣を。</div>`,
        c:`git stash -u                              <span class="c"># 未追跡ファイルも含める</span>
git stash -a                              <span class="c"># ignoredファイルも含む全て</span>
git stash push -m "ログイン機能WIP"       <span class="c"># メッセージ付きで退避</span>
git stash list                            <span class="c"># 一覧（メッセージ付きで表示）</span>
git stash apply stash@{1}                <span class="c"># 番号指定で適用</span>
git stash drop stash@{1}                 <span class="c"># 番号指定で削除</span>` },

             <line x1="390" y1="30" x2="390" y2="50" stroke="#4ade80" stroke-width="1" stroke-dasharray="2,2"/>
             <rect x="563" y="12" width="74" height="18" rx="4" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
             <text x="600" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#fb923c" font-family="sans-serif">🏷 v2.0</text>
             <line x1="600" y1="30" x2="600" y2="50" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>
             <text x="600" y="78" text-anchor="middle" font-size="7.5" fill="#f97316" font-family="sans-serif">注釈付き（推奨）</text>
             <text x="270" y="78" text-anchor="middle" font-size="7.5" fill="#64748b" font-family="sans-serif">タグなし = リリースではない通常コミット</text>
           </svg>
           <div class="two-col">
             <div class="col-git">
               <h4>🪶 軽量タグ</h4>
               <p style="font-size:12px;line-height:1.7;">コミットに名前を貼るだけのシンプルなタグ。作成者・日時などの情報は記録されない。個人的なメモや一時的なマークに使う。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">👤 「ここまで動いた」という個人メモ程度の用途向け。</p>
             </div>
             <div class="col-github">
               <h4>📋 注釈付きタグ（公式リリースに推奨）</h4>
               <p style="font-size:12px;line-height:1.7;">タグ名に加えて、リリースメモ・作成者・作成日時も一緒に記録できる。GitHubのリリース機能と連携しやすく、チームでの公式リリースには必ずこちらを使う。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">👥 「v2.0 リリース」などの節目には注釈付きタグを。</p>
             </div>
           </div>
           <div class="info-box">🖥 <strong>VSCode:</strong> GitLens拡張の「Tags」ビューでタグの一覧確認・作成・削除が可能。タグをクリックすると該当コミットの内容を参照できる。</div>`,
        c:`git tag v1.0                          <span class="c"># 軽量タグを作成（現在のコミットに）</span>
git tag -a v2.0 -m "メジャーリリース"  <span class="c"># 注釈付きタグを作成</span>
git tag                                <span class="c"># タグ一覧</span>
git show v2.0                          <span class="c"># タグの詳細（注釈・日時など）を確認</span>
git tag -d v1.0                        <span class="c"># ローカルのタグを削除</span>` },

      { s:'Section 8: Tag', t:'タグの活用（過去コミット・push・checkout）',
        b:`<div class="analogy">📌 タグは「今いるコミット」だけでなく、過去のコミットにさかのぼって付けることもできる。またタグは通常の push では送られないため、リモートへの共有は別途必要。</div>
           <div class="two-col">
             <div class="col-git">
               <h4>⏮ 過去のコミットにタグを付ける</h4>
               <p style="font-size:12px;line-height:1.7;">リリース後に「あのときのコミットがv1.0だった」と気づいた場合でも、過去のコミットを指定してタグを付けられる。まずコミット履歴を確認して、対象のコミットを特定する。</p>
               <h4 style="margin-top:10px;">☁️ タグをリモートに共有する</h4>
               <p style="font-size:12px;line-height:1.7;">タグは通常の <code>git push</code> では送信されない。チームと共有するには、タグを作成した後に別途 push が必要。全タグをまとめて送ることもできる。</p>
             </div>
             <div class="col-github">
               <h4>🔍 タグを指定して過去のコードを見る</h4>
               <p style="font-size:12px;line-height:1.7;">「v1.0 時点のコードを確認したい」ときにタグを指定して切り替えられる。ただしこの状態は <strong>detached HEAD</strong>（HEAD がブランチを指さず、直接コミットを指している状態）と呼ばれ、そのまま編集するとコミットが迷子になる危険がある。</p>
               <p style="font-size:12px;line-height:1.7;margin-top:6px;">コードを確認するだけならOK。編集する場合は新しいブランチを作成してから作業する。</p>
             </div>
           </div>
           <div class="warn-box">⚠️ タグを指定して切り替えた状態（detached HEAD）でコミットしてもブランチに紐づかないため、後から参照できなくなる。編集作業をする場合は必ずブランチを作成すること。</div>`,
        c:`git log --oneline                      <span class="c"># 過去のコミットを確認</span>
git tag v1.0 &lt;コミットのハッシュ&gt;      <span class="c"># 過去コミットにタグを付ける</span>
git push origin v2.0                   <span class="c"># 特定のタグをリモートに送る</span>
git push origin --tags                 <span class="c"># 全タグをまとめて送る</span>
git push origin --delete v1.0          <span class="c"># リモートのタグを削除</span>
git switch --detach v1.0               <span class="c"># タグ時点のコードを確認（読み取り専用推奨）</span>
git switch -c hotfix/v1.0 v1.0        <span class="c"># タグからブランチを作成して編集</span>` },

      // Section 9
      { type:'section', s:'Section 9', t:'応用・運用', adv:true,
        desc:'個人の使いこなしだけでなく、チーム全体のルールが開発品質を左右する。ブランチ戦略の選び方とコミットを安全に取り消すテクニックを学ぶ。',
        topics:['git-flow vs GitHub flow','コミットの取り消し（revert vs reset）'] },
      { s:'Section 9: 応用・運用', t:'git-flow と GitHub flow の比較',
        b:`<div class="analogy">🗺 チームでどうブランチを運用するかを決めたルールが<strong>ブランチ戦略</strong>。代表的な2つのモデルを理解して、プロジェクトに合った方を選ぶ。</div>

             <text x="390" y="66" font-size="7.5" font-weight="700" fill="white" font-family="sans-serif">feature/xxx　— PRでmainにマージ</text>
             <text x="540" y="88" text-anchor="middle" font-size="8.5" fill="#4ade80" font-family="sans-serif">ブランチはこの2種類のみ・シンプル</text>

           </svg>
           <div class="two-col">
             <div class="col-git">
               <h4>📐 git-flow を選ぶとき</h4>
               <p style="font-size:12px;line-height:1.7;">リリースのタイミングが決まっており、複数バージョンを並行管理する必要があるプロジェクト。モバイルアプリや大規模なエンタープライズ開発に向いている。</p>
             </div>
             <div class="col-github">
               <h4>🌿 GitHub flow を選ぶとき</h4>
               <p style="font-size:12px;line-height:1.7;">Webサービスのように「常にデプロイできる状態」を保ちたいプロジェクト。ルールがシンプルなので小中規模チームや学習にも最適。</p>
             </div>
           </div>
           <div class="info-box">💡 迷ったらまず GitHub flow から始めよう。チームが大きくなりリリース管理が複雑になってきたら git-flow を検討する。</div>`,
        c:`<span class="c"># GitHub flow の基本サイクル</span>
git switch -c feature/xxx         <span class="c"># 機能ブランチを作成</span>
<span class="c"># ... 開発・コミット ...</span>
git push -u origin feature/xxx    <span class="c"># リモートにpush</span>
<span class="c"># PR作成 → レビュー → mainにマージ → デプロイ</span>
git switch main && git pull       <span class="c"># mainを最新に更新</span>
git branch -d feature/xxx         <span class="c"># 不要になったブランチを削除</span>` },

      { s:'Section 9: 応用・運用', t:'コミットの取り消し（revert vs reset）',
        b:`<div class="info-box" style="margin-bottom:8px;">📌 <strong>「取り消し」コマンドの使い分け：</strong><br>
           <span style="display:inline-block;margin-top:4px;font-size:11px;line-height:1.8;">
             <code>git restore</code> — <strong>コミット前</strong>の変更を取り消す（Section 3）<br>
             <code>git revert</code> &nbsp;— <strong>コミット済み</strong>の変更を「打ち消しコミット」で安全に戻す<br>
             <code>git reset</code> &nbsp;&nbsp;— <strong>コミット済み</strong>の変更を「履歴ごと巻き戻す」（強力・要注意）
           </span></div>
           <div class="analogy">↩️ コミットの取り消しには2つの方法がある。<strong>revert</strong>は「打ち消しコミットを追加する安全な方法」、<strong>reset</strong>は「履歴ごと巻き戻す強力な方法」。使い分けが重要。</div>

           <div class="two-col">
             <div class="col-git">
               <h4>✅ revert — 安全な取り消し</h4>
               <p style="font-size:12px;line-height:1.7;">「このコミットで壊れた」という内容を打ち消す新しいコミットを作る。元のコミットは履歴に残るので、チーム共有リポジトリでも安全に使える。</p>
               <p style="font-size:11px;color:#64748b;margin-top:4px;">👥 push済みのコミットを取り消すときはこちら。</p>
             </div>
             <div class="col-github">
               <h4>⚠️ reset — 強力な巻き戻し</h4>
               <p style="font-size:12px;line-height:1.7;">履歴を書き換えて指定コミット以降をなかったことにする。3段階の強さがある。<strong>push済みのコミットには絶対に使わない</strong>こと。</p>
               <ul style="font-size:11.5px;line-height:1.9;padding-left:14px;margin:4px 0 0;">
                 <li><strong>--soft</strong>　— コミットだけ取り消す（変更はステージに残る）</li>
                 <li><strong>--mixed</strong> — ステージも取り消す（変更は手元に残る）<span style="color:#94a3b8;font-size:11px;"> ← デフォルト・省略可</span></li>
                 <li><strong>--hard</strong>　— 変更ごと全て削除。元に戻せない</li>
               </ul>
             </div>
           </div>
           <div class="warn-box">⚠️ <strong>--hard</strong> は取り消した変更が完全に消える。push済みのブランチで使うと他のメンバーのリポジトリと履歴が食い違い、大混乱を招く。迷ったら revert を使おう。</div>`,
        c:`git revert HEAD                   <span class="c"># 直前のコミットを安全に取り消し</span>
git revert &lt;hash&gt;                 <span class="c"># 指定コミットを取り消す新コミット</span>
git reset --soft HEAD~1           <span class="c"># コミットのみ取り消し（変更はステージに残る）</span>
git reset --mixed HEAD~1          <span class="c"># ステージも取り消し（変更は手元に残る）</span>
git reset --hard HEAD~1           <span class="c"># 変更ごと削除（元に戻せない・要注意）</span>` },

          tags: [{text:'HEAD→main', x:239, y:88, col:'#f59e0b'}],
        },
        remote: {
          commits: [
            {id:'C1',  x:430, y:125, col:'#2563eb'},
            {id:'C2',  x:505, y:125, col:'#2563eb'},
            {id:'C3',  x:580, y:125, col:'#2563eb'},
            {id:"C4'", x:665, y:125, col:'#a855f7'},
          ],
          edges: [{f:'C1',t:'C2'},{f:'C2',t:'C3'},{f:'C3',t:"C4'"}],
          tags: [{text:'main', x:635, y:88, col:'#3b82f6'}],
        },
        arrow: {dir:'right', label:'❌ rejected', col:'#ef4444'},
        note: '解決策：git pull でリモートの変更を取り込み、マージ or rebase してから再度 push する。',
      },
      {
        cmd: 'git pull --rebase && git push',
        btn: '⑪ rebase + push',
        title: '⑪ git pull --rebase → push で解決',
        desc: 'pull --rebase でローカルの C4 をリモートの C4\' の上に植え替え。その後 push が成功する。',
        local: {
          commits: [
            {id:'C1',  x:35,  y:125, col:'#2563eb'},
            {id:'C2',  x:100, y:125, col:'#2563eb'},
            {id:'C3',  x:165, y:125, col:'#2563eb'},
            {id:"C4'", x:230, y:125, col:'#a855f7'},
            {id:"C4",  x:295, y:125, col:'#f97316', isNew:true},
          ],
          edges: [{f:'C1',t:'C2'},{f:'C2',t:'C3'},{f:'C3',t:"C4'"},{f:"C4'",t:'C4'}],
          tags: [{text:'HEAD→main', x:254, y:88, col:'#f59e0b'}],
        },
        remote: {
          commits: [
            {id:'C1',  x:415, y:125, col:'#2563eb'},
            {id:'C2',  x:478, y:125, col:'#2563eb'},
            {id:'C3',  x:541, y:125, col:'#2563eb'},
            {id:"C4'", x:604, y:125, col:'#a855f7'},
            {id:'C4',  x:667, y:125, col:'#f97316', isNew:true},
          ],
          edges: [{f:'C1',t:'C2'},{f:'C2',t:'C3'},{f:'C3',t:"C4'"},{f:"C4'",t:'C4'}],
          tags: [{text:'main', x:645, y:88, col:'#3b82f6'}],
        },
        arrow: {dir:'right', label:'push OK ✓', col:'#22c55e'},
        note: "🟠 C4 はオレンジ = rebase で植え替えられたコミット（C4' の後に来る）。",
      },
    ];

    let bvizStep = 0;
    let bvizScenario = 'local';

    function bvizSetScenario(s) { bvizScenario = s; bvizStep = 0; bvizRender(); }
    function bvizNav(d) {
      const steps = bvizScenario === 'remote' ? remoteSteps : bvizSteps;
      bvizStep = Math.max(0, Math.min(steps.length - 1, bvizStep + d));
      bvizRender();
    }
    function bvizJump(idx) { bvizStep = idx; bvizRender(); }
    function bvizReset() { bvizStep = 0; bvizRender(); }

    function bvizRender() {
      const isRemote = bvizScenario === 'remote';
      const steps = isRemote ? remoteSteps : bvizSteps;
      const step = steps[bvizStep];
      const g = id => document.getElementById(id);
      const sa = g('bviz-svg-area');    if (sa) sa.innerHTML = isRemote ? bvizRemoteSVG(step) : bvizSVG(step);
      const tb = g('bviz-title-bar');   if (tb) tb.textContent = step.title;
      const ct = g('bviz-cmd-text');    if (ct) ct.textContent = step.cmd ? ' ' + step.cmd : ' （初期状態）';
      const dt = g('bviz-desc-text');   if (dt) dt.textContent = step.desc;
      const nt = g('bviz-note');        if (nt) { nt.textContent = step.note || ''; nt.style.display = step.note ? '' : 'none'; }
      const pb = g('bviz-prev');        if (pb) pb.disabled = bvizStep === 0;
      const nb = g('bviz-next');        if (nb) nb.disabled = bvizStep === steps.length - 1;
      document.querySelectorAll('.bviz-tab').forEach(t => t.classList.toggle('active', t.dataset.scenario === bvizScenario));
      const legend = g('bviz-legend');
      if (legend) {
        legend.innerHTML = isRemote
          ? `<span class="bviz-leg bviz-leg-main">● コミット（ローカル）</span>
             <span class="bviz-leg bviz-leg-head">▬ HEAD→main</span>
             <span class="bviz-leg bviz-leg-merge">▬ origin/main</span>
             <span class="bviz-leg bviz-leg-feature" style="opacity:0.5">● fetch 済み（未 merge）</span>`
          : `<span class="bviz-leg bviz-leg-main">● main</span>
             <span class="bviz-leg bviz-leg-feature">● feature</span>
             <span class="bviz-leg bviz-leg-merge">● merge コミット</span>
             <span class="bviz-leg bviz-leg-rebase">● rebase コミット</span>
             <span class="bviz-leg bviz-leg-head">▬ HEAD（現在位置）</span>`;
      }
      const dots = g('bviz-dots');
      if (dots) {
        dots.innerHTML = steps.map((_, idx) => {
          const cls = idx === bvizStep ? 'active' : idx < bvizStep ? 'done' : '';
          return `<span class="bviz-dot${cls ? ' ' + cls : ''}" onclick="bvizJump(${idx})" title="ステップ ${idx + 1}"></span>`;
        }).join('');
      }
      const sb = g('bviz-step-bar');
      if (sb) {
        sb.innerHTML = steps.map((s, idx) => {
          const cls = idx === bvizStep ? 'active' : idx < bvizStep ? 'done' : '';
          return `<button class="bviz-step-tag${cls ? ' ' + cls : ''}" onclick="bvizJump(${idx})">${s.btn}</button>`;
        }).join('');
      }
    }

    function bvizSVG(step) {
      const W = 720, H = 215, R = 16;
      const pos = {};
      step.commits.forEach(c => { pos[c.id] = c; });
      const TY = {main:110, feature:175};
      const TC = {main:'#2563eb', feature:'#7c3aed'};

      let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">` +
        `<rect width="${W}" height="${H}" rx="8" fill="#0f172a"/>`;

      (step.tracks || ['main']).forEach(tr => {
        const ty = TY[tr];
        s += `<rect x="4" y="${ty - 14}" width="712" height="28" rx="14" fill="${TC[tr]}" fill-opacity="0.12"/>`;
        s += `<text x="14" y="${ty + 5}" font-size="9" font-weight="700" fill="${TC[tr]}" fill-opacity="0.6" font-family="sans-serif">${tr}</text>`;
      });


      step.edges.forEach(e => {
        const f = pos[e.f], t = pos[e.t];
        if (!f || !t) return;
        const dx = t.x - f.x, dy = t.y - f.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 1) return;
        const ux = dx / d, uy = dy / d;
        const eAttr = e.ghost
          ? `stroke="#475569" stroke-width="2" stroke-dasharray="4,3" opacity="0.4"`
          : `stroke="#475569" stroke-width="2.5" stroke-linecap="round"`;
        s += `<line x1="${(f.x + ux * (R + 2)).toFixed(1)}" y1="${(f.y + uy * (R + 2)).toFixed(1)}" ` +
          `x2="${(t.x - ux * (R + 2)).toFixed(1)}" y2="${(t.y - uy * (R + 2)).toFixed(1)}" ${eAttr}/>`;
      });

      step.commits.forEach(c => {
        const op = c.ghost ? '0.35' : '1';
        if (c.isNew) s += `<circle cx="${c.x}" cy="${c.y}" r="${R + 5}" fill="none" stroke="${c.col}" stroke-width="1.5" opacity="0.5"/>`;
        s += `<circle cx="${c.x}" cy="${c.y}" r="${R}" fill="${c.col}" opacity="${op}"/>`;
        if (c.ghost) s += `<circle cx="${c.x}" cy="${c.y}" r="${R}" fill="none" stroke="${c.col}" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>`;
        const fs = c.id.length > 2 ? '8' : '9.5';
        s += `<text x="${c.x}" y="${c.y + 4}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff" font-family="sans-serif" opacity="${op}">${c.id}</text>`;
      });

      (step.tags || []).forEach(tag => {
        const tw = Math.ceil(tag.text.length * 7.5 + 14);
        s += `<rect x="${tag.x}" y="${tag.y}" width="${tw}" height="17" rx="8" fill="${tag.col}" fill-opacity="0.2" stroke="${tag.col}" stroke-width="1.2"/>`;
        s += `<text x="${(tag.x + tw / 2).toFixed(1)}" y="${tag.y + 11}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tag.col}" font-family="sans-serif">${tag.text}</text>`;
      });

      s += '</svg>';
      return s;
    }
    function bvizRemoteSVG(step) {
      const W = 720, H = 215, R = 13;
      const LP = {x:5,  w:330};
      const RP = {x:385, w:330};

      let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">` +
        `<rect width="${W}" height="${H}" rx="8" fill="#0f172a"/>`;

      s += `<rect x="${LP.x}" y="8" width="${LP.w}" height="${H-16}" rx="8" fill="#172554" fill-opacity="0.5"/>`;
      s += `<rect x="${RP.x}" y="8" width="${RP.w}" height="${H-16}" rx="8" fill="#052e16" fill-opacity="0.5"/>`;
      s += `<text x="${LP.x+12}" y="27" font-size="11" font-weight="700" fill="#60a5fa" font-family="sans-serif">PC  ローカル</text>`;
      s += `<text x="${RP.x+12}" y="27" font-size="11" font-weight="700" fill="#4ade80" font-family="sans-serif">Cloud  origin（GitHub）</text>`;
      s += `<line x1="337" y1="12" x2="337" y2="${H-12}" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>`;
      s += `<line x1="383" y1="12" x2="383" y2="${H-12}" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>`;

      s += `<rect x="${LP.x+4}" y="108" width="${LP.w-8}" height="34" rx="17" fill="#2563eb" fill-opacity="0.10"/>`;
      s += `<rect x="${RP.x+4}" y="108" width="${RP.w-8}" height="34" rx="17" fill="#2563eb" fill-opacity="0.10"/>`;

      // draw panels (edges + commits + tags)
      function drawPanel(data) {
        const pos = {};
        data.commits.forEach(c => { pos[c.id] = c; });
        let ps = '';
        (data.edges || []).forEach(e => {
          const f = pos[e.f], t = pos[e.t]; if (!f || !t) return;
          const dx = t.x-f.x, dy = t.y-f.y, d = Math.sqrt(dx*dx+dy*dy); if (d < 1) return;
          const ux = dx/d, uy = dy/d;
          const attrs = e.ghost
            ? `stroke="#475569" stroke-width="2" stroke-dasharray="4,3" opacity="0.45"`
            : `stroke="#475569" stroke-width="2.5" stroke-linecap="round"`;
          ps += `<line x1="${(f.x+ux*(R+2)).toFixed(1)}" y1="${(f.y+uy*(R+2)).toFixed(1)}" x2="${(t.x-ux*(R+2)).toFixed(1)}" y2="${(t.y-uy*(R+2)).toFixed(1)}" ${attrs}/>`;
        });
        data.commits.forEach(c => {
          const op = c.ghost ? '0.4' : '1';
          if (c.isNew) ps += `<circle cx="${c.x}" cy="${c.y}" r="${R+5}" fill="none" stroke="${c.col}" stroke-width="1.5" opacity="0.5"/>`;
          ps += `<circle cx="${c.x}" cy="${c.y}" r="${R}" fill="${c.col}" opacity="${op}"/>`;
          const fs = c.id.length > 2 ? '7.5' : '9.5';
          ps += `<text x="${c.x}" y="${c.y+4}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff" font-family="sans-serif" opacity="${op}">${c.id}</text>`;
        });
        (data.tags || []).forEach(tag => {
          const tw = Math.ceil(tag.text.length * 7.5 + 14);
          ps += `<rect x="${tag.x}" y="${tag.y}" width="${tw}" height="17" rx="8" fill="${tag.col}" fill-opacity="0.2" stroke="${tag.col}" stroke-width="1.2"/>`;
          ps += `<text x="${(tag.x+tw/2).toFixed(1)}" y="${tag.y+11}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tag.col}" font-family="sans-serif">${tag.text}</text>`;
        });
        return ps;
      }

      s += drawPanel(step.local);
      s += drawPanel(step.remote);

      // center arrow
      if (step.arrow) {
        const ax = 360, ay = 125, col = step.arrow.col;
        if (step.arrow.dir === 'right') {
          s += `<polygon points="342,${ay-7} 378,${ay} 342,${ay+7}" fill="${col}" opacity="0.9"/>`;
          s += `<line x1="337" y1="${ay}" x2="342" y2="${ay}" stroke="${col}" stroke-width="2.5"/>`;
        } else if (step.arrow.dir === 'left') {
          s += `<polygon points="378,${ay-7} 342,${ay} 378,${ay+7}" fill="${col}" opacity="0.9"/>`;
          s += `<line x1="378" y1="${ay}" x2="383" y2="${ay}" stroke="${col}" stroke-width="2.5"/>`;
        }
        const lw = Math.ceil(step.arrow.label.length * 6.5 + 8);
        s += `<rect x="${ax-lw/2}" y="${ay+13}" width="${lw}" height="14" rx="7" fill="${col}" fill-opacity="0.15"/>`;
        s += `<text x="${ax}" y="${ay+23}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${col}" font-family="sans-serif">${step.arrow.label}</text>`;
      }

      s += '</svg>';
      return s;
    }

    // ===== End Branch Visualization =====

    function render(i) {
      const slide = S[i];
      const app = document.getElementById('app');
      if (slide.type === 'title') {
        const contentCount = S.filter(s => !s.type).length;
        app.innerHTML = `
      <div class="slide-title">
        <div class="label">STUDY GUIDE</div>
        <h1>Git 学習資料</h1>
        <p class="sub">9 セクション &nbsp;·&nbsp; ${contentCount} スライド</p>
        <p class="hint">→ キーまたはボタンで次へ進む</p>
      </div>`;
      } else if (slide.type === 'section') {
        const advBadge = slide.adv ? `<div class="sec-adv-badge">🔧 応用セクション — ここからは応用的な使い方</div>` : '';
        const topics = (slide.topics || []).map(t => `<span class="sec-topic">${t}</span>`).join('');
        app.innerHTML = `
      <div class="slide-section${slide.adv ? ' adv' : ''}">
        <div style="position:absolute;top:16px;right:20px;font-size:11px;color:#475569;">${i} / ${total - 1}</div>
        ${advBadge}
        <div class="sec-label">${slide.s}</div>
        <h1>${slide.t}</h1>
        <p class="sec-desc">${slide.desc}</p>
        <div class="sec-topics">${topics}</div>
      </div>`;
      } else if (slide.type === 'branch-viz') {
        bvizStep = 0;
        app.innerHTML = `
      <div class="slide-content">
        <div class="slide-header">
          <span class="section-badge" style="background:#0891b2;">インタラクティブ</span>
          <span class="slide-counter">${i} / ${total - 1}</span>
        </div>
        <div class="bviz-wrap">
          <div class="bviz-scenario-tabs">
            <button class="bviz-tab active" data-scenario="local" onclick="bvizSetScenario('local')">🌿 ローカル操作</button>
            <button class="bviz-tab" data-scenario="remote" onclick="bvizSetScenario('remote')">🌐 リモート連携</button>
          </div>
          <div class="bviz-title-bar" id="bviz-title-bar"></div>
          <div class="bviz-svg-area" id="bviz-svg-area"></div>
          <div class="bviz-legend" id="bviz-legend">
            <span class="bviz-leg bviz-leg-main">● main</span>
            <span class="bviz-leg bviz-leg-feature">● feature</span>
            <span class="bviz-leg bviz-leg-merge">● merge コミット</span>
            <span class="bviz-leg bviz-leg-rebase">● rebase コミット</span>
            <span class="bviz-leg bviz-leg-head">▬ HEAD（現在位置）</span>
          </div>
          <div class="bviz-terminal">
            <div class="bviz-term-chrome"><span></span><span></span><span></span></div>
            <div class="bviz-term-body"><span class="bviz-cmd-prompt">$</span><span id="bviz-cmd-text"></span><span class="bviz-cursor">▊</span></div>
          </div>
          <div class="bviz-desc-bar" id="bviz-desc-text"></div>
          <div id="bviz-note" class="bviz-note-bar" style="display:none;"></div>
          <div class="bviz-controls">
            <button id="bviz-prev" class="bviz-btn" onclick="bvizNav(-1)" disabled>◀ 前へ</button>
            <div id="bviz-dots" class="bviz-dots"></div>
            <button id="bviz-next" class="bviz-btn next" onclick="bvizNav(1)">次のステップ ▶</button>
            <button class="bviz-btn rst" onclick="bvizReset()" title="リセット">↺</button>
          </div>
          <div id="bviz-step-bar" class="bviz-step-bar"></div>
          <div class="bviz-hint-bar">← → キーで操作できます</div>
        </div>
      </div>`;
        bvizRender();
      } else {
        app.innerHTML = `
      <div class="slide-content">
        <div class="slide-header">
          <span class="section-badge" style="${/Section [6-9]/.test(slide.s) ? 'background:#c2410c;' : ''}">${slide.s}</span>
          <span class="slide-counter">${i} / ${total - 1}</span>
        </div>
        <div class="slide-main">
          <h2>${slide.t}</h2>
          ${slide.b}
        </div>
        <div class="cheatsheet">
          <div class="cs-label">Command Reference — VSCode が裏で実行するコマンド</div>
          <div class="cs-body"><pre><code>${slide.c}</code></pre></div>
        </div>
      </div>`;
      }
      document.getElementById('prevBtn').disabled = (i === 0);
      document.getElementById('nextBtn').disabled = (i === total - 1);
      document.getElementById('bar').style.width = `${(i / (total - 1)) * 100}%`;
    }

    function nav(d) {
      const n = cur + d;
      if (n >= 0 && n < total) { cur = n; render(cur); }
    }

    document.addEventListener('keydown', e => {
      const onBviz = S[cur] && S[cur].type === 'branch-viz';
      const bvizLen = (bvizScenario === 'remote' ? remoteSteps : bvizSteps).length;
      if (onBviz && (e.key === 'ArrowRight' || e.key === 'ArrowDown') && bvizStep < bvizLen - 1) { bvizNav(1); return; }
      if (onBviz && (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   && bvizStep > 0)           { bvizNav(-1); return; }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nav(1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')  nav(-1);
    });

    render(0);
  </script>
</body>

</html>
